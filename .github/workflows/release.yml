name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  PROJECT_NAME: gjalalrbot

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

  build:
    strategy:
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-gnu
          - TARGET: x86_64-unknown-linux-musl
          - TARGET: aarch64-unknown-linux-gnu
          - TARGET: aarch64-unknown-linux-musl

    name: Build and Release
    runs-on: ubuntu-slim
    needs: version
    env:
      TARGET: ${{ matrix.TARGET }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: Install Dependencies
        run: |
          sudo apt-get install -yqq crossbuild-essential-arm64 musl-tools

          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          [target.aarch64-unknown-linux-musl]
          linker = "musl-gcc"
          EOF
      - name: Install rust target
        run: rustup target add $TARGET
      - name: Set version
        run: |
          tagName=${{ needs.version.outputs.version }}
          sed -i 's;version\s*=\s*"0.0.0";version = "'"${tagName}"'";' Cargo.toml
          cargo update "$PROJECT_NAME"
      - name: Build
        run: cargo build --locked --release --target $TARGET
      - name: Package
        run: |
          tagName=${{ needs.version.outputs.version }}
          executableName="$PROJECT_NAME"
          mkdir -p dist
          mv target/$TARGET/release/$executableName dist/${executableName}-v${tagName}-${TARGET}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binary-${{ matrix.TARGET }}
          path: dist/
          if-no-files-found: error

  build-containers:
    runs-on: ubuntu-slim
    needs: version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}:${{ needs.version.outputs.version }}

  release:
    permissions:
      contents: write
    needs: [build, build-containers, version]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: binary-*
          path: ./dist/
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          generate_release_notes: true
          files: ./dist/*
          # language=markdown
          body: |
            # Release v${{ needs.version.outputs.version }}
            
            Container images available at:
            ```
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.PROJECT_NAME }}:${{ needs.version.outputs.version }}
            ```
